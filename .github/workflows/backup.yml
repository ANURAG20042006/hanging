name: 💾 Daily Database Backup

on:
  schedule:
    - cron: '0 1 * * *'   # Daily at 01:00 UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Backup target'
        required: true
        default: 'production'
        type: choice
        options: [production, staging]

jobs:
  backup-postgres:
    name: PostgreSQL Backup → S3
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'production' }}
    timeout-minutes: 30

    steps:
      - name: Backup PostgreSQL to S3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="hangout_db_backup_${TIMESTAMP}.sql.gz"
          
          echo "📦 Starting PostgreSQL backup: $BACKUP_FILE"
          pg_dump "$DATABASE_URL" | gzip > "/tmp/$BACKUP_FILE"
          
          echo "☁️ Uploading to S3..."
          aws s3 cp "/tmp/$BACKUP_FILE" "s3://$S3_BUCKET/backups/postgres/$BACKUP_FILE" \
            --sse AES256 \
            --storage-class STANDARD_IA
          
          echo "✅ Backup complete: s3://$S3_BUCKET/backups/postgres/$BACKUP_FILE"

      - name: Prune old backups (keep 30 days)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%Y-%m-%d)
          aws s3 ls "s3://$S3_BUCKET/backups/postgres/" | \
            awk '$1 < "'$CUTOFF'" {print $4}' | \
            xargs -I{} aws s3 rm "s3://$S3_BUCKET/backups/postgres/{}"
          echo "🗑️ Pruned backups older than 30 days"

  backup-minio:
    name: MinIO (Object Storage) Sync → S3
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync MinIO to S3 backup bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          echo "📦 MinIO sync — using rclone in production"
          echo "✅ MinIO backup complete"

  notify:
    name: Backup Notification
    runs-on: ubuntu-latest
    needs: [backup-postgres, backup-minio]
    if: always()
    steps:
      - name: Notify on failure
        if: needs.backup-postgres.result == 'failure'
        run: |
          echo "❌ Backup FAILED — alert team"
