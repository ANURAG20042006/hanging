global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hangout-prod'
    region: 'ap-south-1'

# ─── Alert Rules ──────────────────────────────────────────
rule_files:
  - "/etc/prometheus/alerts/*.yml"

# ─── Alertmanager Integration ─────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# ─── Scrape Configs ───────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Hangout NestJS API (exposes /metrics via prom-client)
  - job_name: 'hangout-api'
    static_configs:
      - targets: ['api:3001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Hangout Next.js Web
  - job_name: 'hangout-web'
    static_configs:
      - targets: ['web:3000']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # PostgreSQL via postgres_exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s

  # MinIO S3 object storage
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']
    scrape_interval: 30s

  # Kafka via kafka_exporter
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s

  # Nginx via nginx_vts_exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']
    scrape_interval: 15s
