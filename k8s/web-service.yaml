apiVersion: v1
kind: Service
metadata:
  name: hangout-web-svc
  namespace: hangout-prod
  labels:
    app: hangout-web
    component: web
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  selector:
    app: hangout-web
    component: web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  sessionAffinity: None
