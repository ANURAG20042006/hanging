apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hangout-ingress
  namespace: hangout-prod
  labels:
    app: hangout
    environment: production
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"

    # TLS — cert-manager will provision and renew the certificate automatically
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting: 100 requests per minute per IP
    nginx.ingress.kubernetes.io/limit-rps: "2"
    nginx.ingress.kubernetes.io/limit-rpm: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

    # HTTPS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hangout.app
      secretName: hangout-app-tls
    - hosts:
        - api.hangout.app
      secretName: hangout-api-tls
  rules:
    - host: hangout.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hangout-web-svc
                port:
                  number: 3000
    - host: api.hangout.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hangout-api-svc
                port:
                  number: 3001
